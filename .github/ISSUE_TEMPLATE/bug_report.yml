name: Bug report
description: Report something that is broken in ProtoPilot
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API keys and personal data from logs or screenshots. Report security issues privately.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page, input, and actions needed to see the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Add an error message or screenshot if useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, or relevant command.
